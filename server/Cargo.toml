[package]
name = "wiki-route-server"
version = "0.1.0"
edition = "2024"
description = "Wikipedia shortest-path server using bidirectional BFS"
license = "MIT"
repository = "https://github.com/michal-pielka/wiki-route"
readme = "../README.md"
keywords = ["wikipedia", "wikipedia-game", "bfs", "graph", "pathfinding"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
